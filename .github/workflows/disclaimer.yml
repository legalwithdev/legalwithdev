name: Disclaimer page + app fixes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - << 'PYEOF'
          import os, sys
          def rep(path, old, new, what, expect=1):
              src = open(path, encoding="utf-8").read()
              n = src.count(old)
              if n != expect:
                  print("FAIL:", what, "count =", n); sys.exit(1)
              open(path, "w", encoding="utf-8").write(src.replace(old, new))
              print("OK:", what)

          # ---- 1. Disclaimer & Terms page banao (privacy page jaisa style) ----
          os.makedirs("disclaimer", exist_ok=True)
          L = [
          "<!DOCTYPE html>",
          "<html lang=\"en\">",
          "<head>",
          "<meta charset=\"UTF-8\" />",
          "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />",
          "<title>Disclaimer \u0026 Terms \u2014 LegalWithDev</title>",
          "<meta name=\"description\" content=\"LegalWithDev is an AI legal-information assistant \u2014 not an advocate. General information only, not legal advice. Read the full disclaimer and terms of use.\" />",
          "<link rel=\"canonical\" href=\"https://legalwithdev.pages.dev/disclaimer\" />",
          "<style>",
          "  body { font-family: system-ui, sans-serif; background: #0b1020; color: #e8edf7; margin: 0; padding: 24px 18px; line-height: 1.7; }",
          "  .card { max-width: 680px; margin: 0 auto; background: #151d33; border: 1px solid #232d4a; border-radius: 16px; padding: 28px 26px; }",
          "  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; color: #8aa2ff; margin: 24px 0 6px; }",
          "  p, li { font-size: 14.5px; color: #c7d0e4; } .muted { color: #8b95ad; font-size: 12.5px; }",
          "  a { color: #8aa2ff; }",
          "</style>",
          "</head>",
          "<body><div class=\"card\">",
          "<h1>\u2696\ufe0f LegalWithDev \u2014 Disclaimer \u0026 Terms of Use</h1>",
          "<p class=\"muted\">Last updated: 24 September 2026</p>",
          "<h2>1. Not legal advice</h2>",
          "<p>LegalWithDev is an <strong>AI legal-information assistant</strong> \u2014 not an advocate, lawyer or law firm. Everything it provides is <strong>general legal information, not legal advice</strong>. Using this website or chatting with the bot does <strong>not</strong> create an advocate-client or lawyer-client relationship. For your specific case, always consult a qualified Advocate/Lawyer. Free legal aid: <a href=\"https://nalsa.gov.in\">nalsa.gov.in</a> \u00b7 15100.</p>",
          "<h2>2. AI can be wrong \u2014 verify what matters</h2>",
          "<p>Answers are generated by an AI model. It can make mistakes, miss facts, or be out of date. Indian law also keeps changing \u2014 for example, the new criminal codes (BNS, BNSS, BSA 2023) replaced older laws. Do not take any important decision (filing, signing, paying, deadlines) based only on this chat. Court deadlines and limitation periods are strict \u2014 a delayed case can be dismissed \u2014 so confirm dates with a professional.</p>",
          "<h2>3. Not a government service</h2>",
          "<p>LegalWithDev is an independent, free project. It is <strong>not affiliated with any government body, court or authority</strong>. Government helplines shown in chat (NALSA 15100, Consumer 1915, Cyber 1930, Anti-Ragging 1800-180-5522) are listed for your convenience.</p>",
          "<h2>4. External links \u0026 affiliate disclosure</h2>",
          "<p>Some links (for example, book recommendations in the <a href=\"/shop\">Shop</a>) are Amazon.in affiliate links \u2014 purchases happen directly on Amazon (payment, delivery, warranty are all handled by Amazon). We may earn a small commission at no extra cost to you. We do not sell or deliver anything.</p>",
          "<h2>5. Terms of use</h2>",
          "<ul>",
          "<li>The service is provided free, \"as is\", without warranties of any kind.</li>",
          "<li>Each user has a limited number of messages per hour (fair use, to prevent abuse).</li>",
          "<li>Please do not share sensitive personal information (name, case numbers, documents, address, Aadhaar) in the chat.</li>",
          "<li>To the maximum extent permitted by applicable law, LegalWithDev is not liable for any loss arising from use of this service.</li>",
          "<li>Misuse (spam, illegal activity, attempting to disrupt the service) is not allowed.</li>",
          "<li>These terms can be updated \u2014 the \"Last updated\" date above will change. Continued use means you accept the current version.</li>",
          "</ul>",
          "<h2>6. Contact</h2>",
          "<p>Questions? Email: <strong>legalwithdev@gmail.com</strong></p>",
          "</div></body>",
          "</html>"]
          open("disclaimer/index.html", "w", encoding="utf-8").write("\n".join(L))
          print("DISCLAIMER PAGE CREATED")

          # ---- 2. Footer links (5 jagah) ----
          rep("index.html",
              "<a href=\"/privacy\">Privacy Policy</a> \u00b7 <a href=\"/shop\">Shop</a>",
              "<a href=\"/privacy\">Privacy Policy</a> \u00b7 <a href=\"/disclaimer\">Disclaimer</a> \u00b7 <a href=\"/shop\">Shop</a>",
              "index footer link")
          rep("index.html",
              "<a href=\"/privacy\">\U0001f512 Privacy Policy</a>",
              "<a href=\"/privacy\">\U0001f512 Privacy Policy</a>\n    <a href=\"/disclaimer\">\U0001f4dc Disclaimer</a>",
              "index menu link")
          rep("app.html",
              "<a href=\"/privacy\">Privacy Policy</a>",
              "<a href=\"/privacy\">Privacy Policy</a>\n          <a href=\"/disclaimer\">Disclaimer</a>",
              "app sidebar link")
          rep("about.html",
              "\u00b7 15100 \u00b7 <a href=\"/privacy\">Privacy Policy</a><br />",
              "\u00b7 15100 \u00b7 <a href=\"/privacy\">Privacy Policy</a> \u00b7 <a href=\"/disclaimer\">Disclaimer</a><br />",
              "about footer link")
          rep("shop.html",
              "\u00b7 15100 \u00b7 <a href=\"/privacy\">Privacy Policy</a><br />",
              "\u00b7 15100 \u00b7 <a href=\"/privacy\">Privacy Policy</a> \u00b7 <a href=\"/disclaimer\">Disclaimer</a><br />",
              "shop footer link")

          # ---- 3. app.html ke 3 user-visible Hinglish fixes ----
          rep("app.html",
              "<a href=\"/about\">Kyunki LegalWithDev?</a>",
              "<a href=\"/about\">Why LegalWithDev?</a>",
              "app about link")
          rep("app.html",
              "<div class=\"sfoot\">100% free \u00b7 Bina login<br />Chats sirf is device pe</div>",
              "<div class=\"sfoot\">100% free \u00b7 No login<br />Chats stay only on this device</div>",
              "app sfoot")
          rep("app.html",
              "addMsg('Connection error \u2014 server se connect nahi ho paya. Kuch der baad try karein.', 'bot');",
              "addMsg('Connection error \u2014 could not reach the server. Please try again in a little while.', 'bot');",
              "app connection error msg")

          # ---- 4. sitemap me disclaimer ----
          rep("sitemap.xml",
              "</urlset>",
              "  <url>\n    <loc>https://legalwithdev.pages.dev/disclaimer</loc>\n    <lastmod>2026-09-24</lastmod>\n    <changefreq>yearly</changefreq>\n    <priority>0.3</priority>\n  </url>\n</urlset>",
              "sitemap entry")

          # ---- 5. sw.js v7 (disclaimer bhi network-first) ----
          rep("sw.js", "const CACHE = \"lwd-static-v6\";", "const CACHE = \"lwd-static-v7\";", "sw cache name")
          rep("sw.js",
              "url.pathname.startsWith(\"/privacy\")",
              "url.pathname.startsWith(\"/privacy\") || url.pathname.startsWith(\"/disclaimer\")",
              "sw dynamic list")
          rep("sw.js",
              "   v6: /about, /shop, /privacy bhi network-first + naya cache naam - v5 cache me\n       fase purane (Hinglish) pages delete ho jate hain, sabko fresh English mile.\n*/",
              "   v6: /about, /shop, /privacy bhi network-first + naya cache naam - v5 cache me\n       fase purane (Hinglish) pages delete ho jate hain, sabko fresh English mile.\n   v7: /disclaimer bhi network-first.\n*/",
              "sw comment")
          print("ALL PATCHES DONE")
          PYEOF
          python3 - << 'PYEOF'
          from html.parser import HTMLParser
          VOID = {'meta','link','img','br','input','hr','source','area','base','col','embed','track','wbr'}
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]; self.errors=[]
              def handle_starttag(self, t, a):
                  if t not in VOID: self.stack.append(t)
              def handle_endtag(self, t):
                  if t in VOID: return
                  if self.stack and self.stack[-1]==t: self.stack.pop()
                  else: self.errors.append(t)
          for f in ['index.html','app.html','about.html','shop.html','disclaimer/index.html']:
              p=P(); p.feed(open(f, encoding='utf-8').read())
              assert not p.stack and not p.errors, (f, p.stack, p.errors[:3])
          print('ALL HTML BALANCED')
          c = open('disclaimer/index.html', encoding='utf-8').read()
          assert 'not legal advice' in c and 'nalsa.gov.in' in c and '2026' in c
          for f in ['index.html','app.html','about.html','shop.html']:
              assert 'href="/disclaimer"' in open(f, encoding='utf-8').read(), f
          a = open('app.html', encoding='utf-8').read()
          assert 'Kyunki' not in a and 'Bina login' not in a and 'Chats sirf' not in a
          s = open('sw.js', encoding='utf-8').read()
          assert 'lwd-static-v7' in s and '/disclaimer' in s
          m = open('sitemap.xml', encoding='utf-8').read()
          assert m.count('/disclaimer') == 1
          print('ALL CONTENT CHECKS PASSED')
          PYEOF
          git config user.name "legalwithdev-bot"
          git config user.email "action@github.com"
          git add -A
          git commit -m "Disclaimer & Terms page + footer links + sitemap + sw v7 + app English fixes"
          git push
