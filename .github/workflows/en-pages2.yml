name: English pages 2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - << 'PYEOF'
          import re, sys
          def rep(path, old, new, what, expect=1):
              src = open(path, encoding="utf-8").read()
              n = src.count(old)
              if n != expect:
                  print("FAIL:", what, "count =", n); sys.exit(1)
              open(path, "w", encoding="utf-8").write(src.replace(old, new))
              print("OK:", what)
          P = "blog/index.html"
          s = open(P, encoding="utf-8").read()
          if "Kanoon, aapki bhasha me" not in s:
              print("FAIL: blog index old text missing"); sys.exit(1)
          for old, new in [
           ("Kanoon, aapki bhasha me \u2014 simple guides by Dev",
            "The law, in your language \u2014 simple guides by Dev"),
           ("Muft Kanooni Madad (Free Legal Aid) \u2014 Bharat me kaun, kaise aur kahan",
            "Free Legal Aid in India \u2014 who qualifies, how and where"),
           ("Advocate ka kharcha har koi nahi utha sakta. Isliye Bharat ke Samvidhan ne Article 39A me aur Legal Services Authorities Act, 1987 ke tahat muft kanooni madad ka intezaam kiya hai.",
            "Not everyone can afford a lawyer. That is why the Constitution of India, under Article 39A and the Legal Services Authorities Act, 1987, provides for free legal aid."),
           ("Padhiye &rarr;", "Read &rarr;"),
          ]:
              if s.count(old) != 1:
                  print("FAIL: blog index pair"); sys.exit(1)
              s = s.replace(old, new)
          open(P, "w", encoding="utf-8").write(s)
          print("BLOG LISTING DONE")
          p = "blog/free-legal-aid-guide.md"
          if "Muft Kanooni Madad" not in open(p, encoding="utf-8").read():
              print("FAIL: old md missing"); sys.exit(1)
          MD = "\n".join([
          "# Free Legal Aid in India \u2014 who qualifies, how and where",
          "",
          "date: 18 September 2026",
          "",
          "Not everyone can afford a lawyer. That is why the Constitution of India, under Article 39A and the Legal Services Authorities Act, 1987, provides for free legal aid. Here is who qualifies and how to get it.",
          "",
          "---",
          "",
          "## What is free legal aid?",
          "",
          "Free legal aid means: the government can bear the cost of an advocate for you, court fees can be waived, and legal advice can be free. It is administered through the **National Legal Services Authority (NALSA)** \u2014 every state has a State Legal Services Authority and every district has a District Legal Services Authority (DLSA).",
          "",
          "## Who qualifies?",
          "",
          "In general, these categories qualify (for the complete list, confirm with a qualified Advocate/Lawyer or NALSA):",
          "",
          "- Women",
          "- Children",
          "- Scheduled Caste / Scheduled Tribe members",
          "- Low-income citizens (income limits vary by state)",
          "- Victims of trafficking",
          "- Persons in custody (who fulfil the conditions)",
          "",
          "## How to get it \u2014 3 easy routes",
          "",
          "1. **Helpline 15100** \u2014 NALSA's toll-free national helpline number. Call and get advice.",
          "2. **Website** \u2014 apply online and find full information at nalsa.gov.in.",
          "3. **DLSA office** \u2014 the District Legal Services Authority office near your district collectorate/district court. You can walk in and apply.",
          "",
          "## What services do you get?",
          "",
          "- Free legal advice",
          "- A free advocate for court",
          "- Help with court fees and other costs (where applicable)",
          "- Case resolution through Lok Adalat",
          "",
          "## Important",
          "",
          "This is general information, not legal advice. Every case is different \u2014 for your case, consult a qualified Advocate/Lawyer or NALSA/DLSA. As with every answer, one reminder here too: **for advice, always go to an expert.**",
          "",
          "---",
          "",
          "*Sources: nalsa.gov.in \u00b7 Helpline 15100 \u00b7 Legal Services Authorities Act, 1987 \u00b7 Article 39A of the Constitution*",
          ""])
          open(p, "w", encoding="utf-8").write(MD)
          print("GUIDE MD DONE")
          p = "blog/free-legal-aid-guide/index.html"
          s = open(p, encoding="utf-8").read()
          if "Muft Kanooni Madad" not in s:
              print("FAIL: old guide html missing"); sys.exit(1)
          if s.count("Muft Kanooni Madad (Free Legal Aid) \u2014 Bharat me kaun, kaise aur kahan") != 3:
              print("FAIL: guide title count unexpected"); sys.exit(1)
          B = [
          "<body><div class=\"page\"><a class='top' href='/blog'>&larr; All articles</a><h1>Free Legal Aid in India \u2014 who qualifies, how and where</h1><div class='date'>18 September 2026 \u00b7 LegalWithDev</div>",
          "<p>Not everyone can afford a lawyer. That is why the Constitution of India, under Article 39A and the Legal Services Authorities Act, 1987, provides for free legal aid. Here is who qualifies and how to get it.</p>",
          "<h3>What is free legal aid?</h3>",
          "<p>Free legal aid means: the government can bear the cost of an advocate for you, court fees can be waived, and legal advice can be free. It is administered through the <strong>National Legal Services Authority (NALSA)</strong> \u2014 every state has a State Legal Services Authority and every district has a District Legal Services Authority (DLSA).</p>",
          "<h3>Who qualifies?</h3>",
          "<p>In general, these categories qualify (for the complete list, confirm with a qualified Advocate/Lawyer or NALSA):</p>",
          "<ul>",
          "<li>Women</li>",
          "<li>Children</li>",
          "<li>Scheduled Caste / Scheduled Tribe members</li>",
          "<li>Low-income citizens (income limits vary by state)</li>",
          "<li>Victims of trafficking</li>",
          "<li>Persons in custody (who fulfil the conditions)</li>",
          "</ul>",
          "<h3>How to get it \u2014 3 easy routes</h3>",
          "<p>1. <strong>Helpline 15100</strong> \u2014 NALSA's toll-free national helpline number. Call and get advice.</p>",
          "<p>2. <strong>Website</strong> \u2014 apply online and find full information at nalsa.gov.in.</p>",
          "<p>3. <strong>DLSA office</strong> \u2014 the District Legal Services Authority office near your district collectorate/district court. You can walk in and apply.</p>",
          "<h3>What services do you get?</h3>",
          "<ul>",
          "<li>Free legal advice</li>",
          "<li>A free advocate for court</li>",
          "<li>Help with court fees and other costs (where applicable)</li>",
          "<li>Case resolution through Lok Adalat</li>",
          "</ul>",
          "<h3>Important</h3>",
          "<p>This is general information, not legal advice. Every case is different \u2014 for your case, consult a qualified Advocate/Lawyer or NALSA/DLSA. As with every answer, one reminder here too: <strong>for advice, always go to an expert.</strong></p>",
          "<p><em>Sources: nalsa.gov.in \u00b7 Helpline 15100 \u00b7 Legal Services Authorities Act, 1987 \u00b7 Article 39A of the Constitution</em></p></div></body>"]
          BODY = "\n".join(B)
          s = s.replace("Muft Kanooni Madad (Free Legal Aid) \u2014 Bharat me kaun, kaise aur kahan \u2014 LegalWithDev Blog",
                        "Free Legal Aid in India \u2014 who qualifies, how and where \u2014 LegalWithDev Blog")
          s2, n = re.subn(r"<body>.*?</body>", lambda m: BODY, s, count=1, flags=re.S)
          if n != 1 or "Muft" in s2:
              print("FAIL: guide html body replace"); sys.exit(1)
          open(p, "w", encoding="utf-8").write(s2)
          print("GUIDE HTML DONE")
          P = "privacy/index.html"
          s = open(P, encoding="utf-8").read()
          if "Kya store hota hai" not in s:
              print("FAIL: old privacy not found"); sys.exit(1)
          N = [
          "<body><div class=\"card\">",
          "<h1>\u2696\ufe0f LegalWithDev \u2014 Privacy Policy</h1>",
          "<p class=\"muted\">Last updated: 24 September 2026</p>",
          "<h2>1. What is stored</h2>",
          "<p>On our website, your chat history is <strong>never stored on the server</strong>. The conversation stays only in your browser's memory (RAM) and is gone when you close the page.</p>",
          "<p>On Telegram / WhatsApp, your recent messages stay only in the server's temporary memory (RAM) <strong>to remember the conversation context</strong>. This data is not saved to disk and is cleared when the server restarts.</p>",
          "<h2>2. Where your data goes</h2>",
          "<p>When you ask a question, the message reaches our server over an <strong>HTTPS (encrypted) connection</strong> and is sent to the <strong>Google Gemini API</strong> to generate the AI answer.</p>",
          "<p><strong>As per Google's Unpaid (Free) Tier terms:</strong> on the free tier, Google may use your submitted content and AI responses to improve its products and machine learning, and for quality purposes <strong>human reviewers may also read this data</strong> (Google displays this data separated from your account/API key). That is why Google itself says: <strong>\"Do not submit sensitive, confidential, or personal information to the Unpaid Services\"</strong>.</p>",
          "<p><strong>\U0001f512 So our request:</strong> please do not share your sensitive personal information in the chat \u2014 name, case numbers, documents, address, Aadhaar. Ask your question in general terms (for example: \"My landlord is not returning my deposit, what can I do?\").</p>",
          "<p>We do not <strong>sell</strong> your data to anyone, and we do not use it for <strong>AI training</strong> ourselves.</p>",
          "<h2>3. Rate limiting</h2>",
          "<p>To keep the service free for everyone, each user/IP has a limited number of messages per hour (to prevent abuse/spam).</p>",
          "<h2>4. What we do NOT do</h2>",
          "<ul>",
          "<li>Ask for or store your name, phone, address or case details</li>",
          "<li>Sell data or use it for advertising</li>",
          "<li>Read back your chat history (it is never stored in the first place)</li>",
          "</ul>",
          "<h2>5. Contact & Disclaimer</h2>",
          "<p>LegalWithDev is an <strong>AI legal-information assistant</strong> \u2014 not an advocate. It provides general legal information, not legal advice. For your case, please consult a qualified Advocate/Lawyer. Free legal aid: <a href=\"https://nalsa.gov.in\">nalsa.gov.in</a> \u00b7 15100.</p>",
          "<p>Questions? Email: <strong>legalwithdev@gmail.com</strong></p>",
          "</div></body>"]
          NEW = "\n".join(N)
          s2, n = re.subn(r"<body>.*?</body>", lambda m: NEW, s, count=1, flags=re.S)
          if n != 1:
              print("FAIL: privacy body replace"); sys.exit(1)
          open(P, "w", encoding="utf-8").write(s2)
          print("PRIVACY DONE")
          PYEOF
          FILES="about.html shop.html app.html index.html privacy/index.html blog/index.html blog/free-legal-aid-guide.md blog/free-legal-aid-guide/index.html"
          if grep -qE "poochho|bhasha|kanoon sabki|jawab|sabki|shuru karo|hazir|bechta|Muft|haqdaar|samajh raha|dhundh raha|kaam kar raha|Main hoon|ka apna|ke liye|ya business" $FILES; then
            echo "HINGLISH STILL PRESENT:"; grep -nE "poochho|bhasha|kanoon sabki|jawab|sabki|shuru karo|hazir|bechta|Muft|haqdaar|samajh raha|dhundh raha|kaam kar raha|Main hoon|ka apna|ke liye|ya business" $FILES; exit 1
          fi
          python3 - << 'PYEOF'
          from html.parser import HTMLParser
          VOID = {'meta','link','img','br','input','hr','source','area','base','col','embed','track','wbr'}
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]; self.errors=[]
              def handle_starttag(self, t, a):
                  if t not in VOID: self.stack.append(t)
              def handle_endtag(self, t):
                  if t in VOID: return
                  if self.stack and self.stack[-1]==t: self.stack.pop()
                  else: self.errors.append(t)
          for f in ['about.html','shop.html','app.html','index.html','privacy/index.html','blog/index.html','blog/free-legal-aid-guide/index.html']:
              p=P(); p.feed(open(f, encoding='utf-8').read())
              assert not p.stack and not p.errors, (f, p.stack, p.errors[:3])
          print('ALL HTML BALANCED')
          PYEOF
          echo "ALL CHECKS PASSED"
          git rm -f en-about.py en-shop-a.py en-shop-b.py en-ui.py en-privacy.py en-blog-a.py en-blog-b.py en-blog.py en-shop.py >/dev/null 2>&1 || true
          rm -f .github/workflows/en-pages.yml .github/workflows/en-pages1.yml .github/workflows/en-pages2.yml
          git config user.name "legalwithdev-bot"
          git config user.email "action@github.com"
          git add -A
          git commit -m "English pages 2/2: privacy, blog, guide + cleanup (facts unchanged)"
          git push
