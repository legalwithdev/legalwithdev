name: move-menu-right
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move menu button to the right
        run: python3 _patch_videos4.py
      - name: Commit and push
        run: |
          git config user.name "legalwithdev-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html app.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Move header menu button to the right side"
            git push
          fi
