name: add-videos-button
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pages
        run: python3 _patch_videos.py
      - name: Commit and push
        run: |
          git config user.name "legalwithdev-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html app.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Add Watch legal videos button above chat box (index + app)"
            git push
          fi
