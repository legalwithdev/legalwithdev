name: Revert homepage view
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 revert-css.py
          python3 revert-html.py
          if grep -q "chat-head" index.html; then echo "CHAT-HEAD STILL THERE - REVERT FAILED"; exit 1; fi
          if grep -q "scrollIntoView" index.html; then echo "SCROLL STILL THERE - REVERT FAILED"; exit 1; fi
          if grep -q "body.chatting #home" index.html; then echo "OLD VIEW OK"; else echo "OLD VIEW MISSING"; exit 1; fi
          rm -f revert-css.py revert-html.py .github/workflows/fix-revert.yml
          git config user.name "legalwithdev-bot"
          git config user.email "action@github.com"
          git add -A
          git commit -m "Revert homepage to previous version (user order)"
          git push
