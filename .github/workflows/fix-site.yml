name: Website view with chat box
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 site-css.py
          python3 site-html.py
          if grep -q "chat-head" index.html; then echo "HEAD OK"; else echo "HEAD MISSING"; exit 1; fi
          if grep -q "body.chatting" index.html; then echo "CHATTING STILL THERE"; exit 1; fi
          if grep -q "scrollIntoView" index.html; then echo "SCROLL OK"; else echo "SCROLL MISSING"; exit 1; fi
          if grep -q "position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;" index.html; then echo "DOCK STILL FIXED"; exit 1; fi
          rm -f site-css.py site-html.py .github/workflows/fix-site.yml
          git config user.name "legalwithdev-bot"
          git config user.email "action@github.com"
          git add -A
          git commit -m "Website view: AI assistant chat box embedded on homepage"
          git push
