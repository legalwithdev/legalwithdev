name: bigger-bold-chat-text
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat text size
        run: python3 _patch_text.py
      - name: Commit and push
        run: |
          git config user.name "legalwithdev-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html app.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Make chat message text bigger and bolder"
            git push
          fi
