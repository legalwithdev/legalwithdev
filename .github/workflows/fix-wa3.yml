name: Fix brain signal placement
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's/temperature: 0.3, ...extra, signal: AbortSignal.timeout(12000) }),/temperature: 0.3, ...extra }),\n        signal: AbortSignal.timeout(12000),/' functions/_lib/brain.js
          grep -q "extra, signal" functions/_lib/brain.js && { echo "STILL BROKEN"; exit 1; }
          grep -q "signal: AbortSignal.timeout(12000)," functions/_lib/brain.js || { echo "PATCH FAILED"; exit 1; }
          cp functions/_lib/brain.js /tmp/b.mjs && node --check /tmp/b.mjs || { echo "SYNTAX FAIL"; exit 1; }
          rm -f .github/workflows/fix-wa.yml .github/workflows/fix-wa2.yml .github/workflows/fix-wa3.yml
          git config user.name "legalwithdev-bot"
          git config user.email "action@github.com"
          git add -A
          git commit -m "Fix: AbortSignal in fetch options (was wrongly in JSON body); remove old fix workflows"
          git push
