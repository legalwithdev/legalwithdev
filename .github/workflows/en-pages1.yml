name: English pages 1
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 en-about.py
          python3 en-shop-a.py
          sed -i 's/samaj  raha hoon/samajh raha hoon/g' en-ui.py
          python3 en-ui.py
          python3 - << 'PYEOF'
          import sys
          def rep(path, old, new, what, expect=1):
              src = open(path, encoding="utf-8").read()
              n = src.count(old)
              if n != expect:
                  print("FAIL:", what, "count =", n); sys.exit(1)
              open(path, "w", encoding="utf-8").write(src.replace(old, new))
              print("OK:", what)
          F = "shop.html"
          rep(F, "Previous year question papers + solved answers \u2014 exam pattern samajhne ka best tarika.",
                 "Previous year question papers + solved answers \u2014 the best way to understand the exam pattern.",
                 "PYQ desc")
          rep(F, "Legal reasoning, logical aptitude \u2014 entrance exams aur mooting ke liye practice material.",
                 "Legal reasoning and logical aptitude \u2014 practice material for entrance exams and mooting.",
                 "reasoning desc")
          rep(F, "Legal terms ki dictionary \u2014 Latin maxims se lekar Indian legal vocabulary tak.",
                 "A dictionary of legal terms \u2014 from Latin maxims to Indian legal vocabulary.",
                 "dictionary desc")
          rep(F, "Law-themed t-shirts, mugs aur desk accessories",
                 "Law-themed t-shirts, mugs and desk accessories",
                 "section 3 sub")
          rep(F, "Funny aur classy lawyer-themed t-shirts \u2014 law students ke liye perfect college wear.",
                 "Funny and classy lawyer-themed t-shirts \u2014 perfect college wear for law students.",
                 "tshirts desc")
          rep(F, '"Objection!" aur "It Depends" wale mugs \u2014 court ke lambe dinon ke liye coffee companion.',
                 '"Objection!" and "It Depends" mugs \u2014 a coffee companion for long days in court.',
                 "mugs desc")
          rep(F, "Table/desk ke liye lady justice statues aur scales of justice \u2014 office ya study room ke liye.",
                 "Lady justice statues and scales of justice for your table or desk \u2014 for office or study room.",
                 "decor desc")
          rep(F, "Legal pads, advocate notebooks aur case-files style stationery \u2014 notes ke liye.",
                 "Legal pads, advocate notebooks and case-file style stationery \u2014 for your notes.",
                 "pads desc")
          rep(F, "\u2190 LegalWithDev pe wapas jao \u2014 FREE legal sawal poochho",
                 "\u2190 Back to LegalWithDev \u2014 ask a FREE legal question",
                 "back link")
          rep(F, "\u26a0\ufe0f LegalWithDev products bechta nahi \u2014 yeh curated affiliate links hain (Amazon.in). Purchase, payment, delivery sab Amazon handle karta hai.",
                 "\u26a0\ufe0f LegalWithDev does not sell products \u2014 these are curated affiliate links (Amazon.in). Purchase, payment and delivery are all handled by Amazon.",
                 "footer note")
          rep(F, "Amazon pe dekhein \u2192", "View on Amazon \u2192", "amazon cta", expect=16)
          print("SHOP PART B DONE")
          PYEOF
          git rm -f en-shop.py en-shop-b.py >/dev/null 2>&1 || true
          git config user.name "legalwithdev-bot"
          git config user.email "action@github.com"
          git add -A
          git commit -m "English pages 1/2: about, shop, app+index UI texts"
          git push
