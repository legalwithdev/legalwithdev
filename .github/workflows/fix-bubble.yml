name: Bubble text English
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 bubble-en.py
          if grep -q "aapka legal saathi" index.html; then echo "HINGLISH STILL THERE"; exit 1; fi
          if grep -q "Kanoon ka koi" index.html; then echo "HINGLISH BUBS STILL THERE"; exit 1; fi
          if grep -q "your legal companion" index.html; then echo "ENGLISH BUBBLE OK"; else echo "ENGLISH BUBBLE MISSING"; exit 1; fi
          rm -f bubble-en.py .github/workflows/fix-bubble.yml
          git config user.name "legalwithdev-bot"
          git config user.email "action@github.com"
          git add -A
          git commit -m "Mascot bubble texts: default English (site default language)"
          git push
