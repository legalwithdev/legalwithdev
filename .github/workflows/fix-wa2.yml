name: Assemble whatsapp.js and patch brain
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat wa-part1.js wa-part2.js > functions/webhook/whatsapp.js
          rm wa-part1.js wa-part2.js
          sed -i 's/temperature: 0.3, ...extra }),/temperature: 0.3, ...extra, signal: AbortSignal.timeout(12000) }),/' functions/_lib/brain.js
          sed -i 's/for (let attempt = 0; attempt < 3; attempt++)/for (let attempt = 0; attempt < 2; attempt++)/' functions/_lib/brain.js
          sed -i 's/if (attempt === 2) break;/if (attempt === 1) break;/' functions/_lib/brain.js
          grep -q "AbortSignal.timeout" functions/_lib/brain.js || { echo "BRAIN PATCH FAILED"; exit 1; }
          grep -q "waitUntil" functions/webhook/whatsapp.js || { echo "ASSEMBLE FAILED"; exit 1; }
          grep -q "wa:seen:" functions/webhook/whatsapp.js || { echo "DEDUP MISSING"; exit 1; }
          git config user.name "legalwithdev-bot"
          git config user.email "action@github.com"
          git add -A
          git commit -m "WhatsApp: instant 200 + background send + msg dedup; brain: 12s AI timeout"
          git push
