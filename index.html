<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="google-site-verification" content="jV93AThtzf2YsdrRRUE-NLsSKcHNB0nHJ3JVRY_C3mM" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LegalWithDev — Legal AI Assistant</title>
<style>
  :root {
    --bg: #0b1020; --bg2: #101830; --card: #151d33; --line: #232d4a;
    --ink: #e8edf7; --muted: #8b95ad; --brand: #6d8cff; --brand2: #8aa2ff;
    --accent: #4f7cff; --user-bg: linear-gradient(135deg, #4356d9, #6d5df6);
    --bot-bg: #151d33; --ok: #34d399; --chip-bg: rgba(109,140,255,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #1a2450 0%, var(--bg) 55%) fixed, var(--bg);
    color: var(--ink); display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    background: rgba(16,24,48,.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
  }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #2b3a6e, #4f7cff);
    display: flex; align-items: center; justify-content: center; font-size: 21px;
    box-shadow: 0 0 0 2px rgba(109,140,255,.25);
  }
  header h1 { font-size: 16.5px; font-weight: 700; letter-spacing: .2px; }
  header .sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); display: inline-block; }
  #chat { flex: 1; overflow-y: auto; padding: 20px 14px 10px; display: flex; flex-direction: column; gap: 14px; max-width: 840px; width: 100%; margin: 0 auto; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row.user { justify-content: flex-end; }
  .row .mini-avatar { width: 30px; height: 30px; border-radius: 50%; font-size: 15px; flex-shrink: 0;
    background: linear-gradient(135deg, #2b3a6e, #4f7cff); display: flex; align-items: center; justify-content: center; }
  .msg { max-width: 86%; padding: 13px 16px; border-radius: 18px; line-height: 1.65; font-size: 14.5px; word-wrap: break-word; animation: pop .18s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .bot .msg { background: var(--bot-bg); border: 1px solid var(--line); border-bottom-left-radius: 6px; color: var(--ink); }
  .user .msg { background: var(--user-bg); border-bottom-right-radius: 6px; color: #fff; box-shadow: 0 6px 18px rgba(67,86,217,.35); }
  .msg h3, .msg .sec {
    font-size: 13px; font-weight: 700; color: var(--brand2); text-transform: uppercase; letter-spacing: .8px;
    margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 1px dashed var(--line);
  }
  .msg h3:first-child { margin-top: 0; }
  .msg strong { color: #fff; }
  .msg em { color: var(--muted); }
  .msg ul { margin: 6px 0 6px 18px; }
  .msg li { margin: 3px 0; }
  .msg .duty { margin-top: 12px; padding: 8px 12px; border-left: 3px solid var(--accent); background: rgba(79,124,255,.07); border-radius: 0 10px 10px 0; font-size: 13px; color: #b9c6e8; }
  .msg .helpline { color: #7ee2b8; font-weight: 600; }
  footer { background: rgba(16,24,48,.85); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 10px 12px 12px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    background: var(--chip-bg); color: var(--brand2); border: 1px solid rgba(109,140,255,.25);
    border-radius: 999px; font-size: 12.5px; padding: 7px 14px; cursor: pointer; white-space: nowrap;
    transition: background .15s, transform .1s;
  }
  .chip:hover { background: rgba(109,140,255,.18); }
  .chip:active { transform: scale(.96); }
  form { display: flex; gap: 10px; max-width: 840px; margin: 0 auto; }
  .inputwrap { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; display: flex; align-items: center; padding: 2px 4px 2px 14px; }
  input { flex: 1; border: 0; background: transparent; color: var(--ink); font-size: 15px; outline: none; padding: 11px 0; }
  input::placeholder { color: #5d6884; }
  #send { background: var(--user-bg); border: 0; border-radius: 11px; padding: 10px 18px; font-size: 14.5px; color: #fff; cursor: pointer; font-weight: 600; }
  #send:disabled { opacity: .5; }
  .legal-note { text-align: center; font-size: 10.5px; color: #5d6884; padding: 8px 16px 2px; }
  .typing { display: inline-flex; gap: 5px; padding: 8px 2px; }
  .typing span { width: 8px; height: 8px; background: var(--brand); border-radius: 50%; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
</style>
</head>
<body>
  <header>
    <div class="avatar">⚖️</div>
    <div>
      <h1>LegalWithDev</h1>
      <div class="sub"><span class="dot"></span> Online · Answers in your language + हिंदी + English</div>
    </div>
  </header>

  <div id="chat"></div>

  <footer>
    <div class="chips" id="chips">
      <button class="chip">My landlord won't return my deposit</button>
      <button class="chip">How do I file a consumer complaint?</button>
      <button class="chip">Cheque bounce — what can I do?</button>
      <button class="chip">Company is not paying my salary</button>
      <button class="chip">UPI fraud — help!</button>
      <button class="chip">How to file an RTI?</button>
    </div>
    <form id="f">
      <div class="inputwrap"><input id="q" placeholder="Apna legal sawal poochhiye…" autocomplete="off" /></div>
      <button id="send">Send ➤</button>
    </form>
    <p class="legal-note">⚠️ General information only — consult a qualified lawyer. Free legal aid: nalsa.gov.in · 15100</p>
  </footer>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('f');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');
const chatHistory = [];  // conversation memory

function esc(s) {
  return s.split('&').join('&' + 'amp;').split('<').join('&' + 'lt;').split('>').join('&' + 'gt;');
}
function fmt(text) {
  let h = esc(text);
  // helpline numbers stand out
  h = h.replace(/\b(15100|1800[-\s]?180[-\s]?5522|1800[-\s]?11[-\s]?4000|1915|1930|1091|112|100)\b/g, '<span class="helpline">$1</span>');
  // headings: ### / **Heading:** lines
  h = h.replace(/^#{1,3}\s*(.+)$/gm, '<div class="sec">$1</div>');
  h = h.replace(/^\*\*(.+?):?\*\*$/gm, '<div class="sec">$1</div>');
  // duty footer highlight
  h = h.replace(/^(\*?_?)?(Kartavya|कर्तव्य|Duties to Bharat|Fundamental Duties|अधिकारों के साथ|अपने देश)([\s\S]{0,400})$/m, '<div class="duty">$2$3</div>');
  // bold + italic
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/(^|\s)_(.+?)_(\s|$)/g, '$1<em>$2</em>$3');
  // simple bullet lists
  h = h.replace(/^(?:[-•*]|\d+\.)\s+(.+)$/gm, '<li>$1</li>');
  h = h.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
  // separators
  h = h.replace(/^(---|\*\*\*)$/gm, '<div style="height:8px"></div>');
  return h;
}
function add(text, who) {
  const row = document.createElement('div');
  row.className = 'row ' + who;
  if (who === 'bot') {
    const av = document.createElement('div');
    av.className = 'mini-avatar'; av.textContent = '⚖️';
    row.appendChild(av);
  }
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = who === 'bot' ? fmt(text) : esc(text);
  row.appendChild(div);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function ask(text) {
  if (!text.trim()) return;
  add(text, 'user');
  input.value = '';
  sendBtn.disabled = true;
  const t = add('<span class="typing"><span></span><span></span><span></span></span>', 'bot');
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: chatHistory.slice(-6) })
    });
    const data = await res.json();
    t.remove();
    const reply = data.reply || 'Sorry, something went wrong.';
    add(reply, 'bot');
    chatHistory.push({ role: 'user', content: text });
    chatHistory.push({ role: 'assistant', content: reply });
  } catch (e) {
    t.remove();
    add('Connection error — is the server running?', 'bot');
  }
  sendBtn.disabled = false;
  input.focus();
}

form.addEventListener('submit', e => { e.preventDefault(); ask(input.value); });
document.getElementById('chips').addEventListener('click', e => {
  if (e.target.classList.contains('chip')) ask(e.target.textContent);
});

add('Namaste! 🙏 I am LegalWithDev — your legal information assistant for Bharat.\n\nAsk me anything about: consumer rights, tenant/rent issues, divorce & maintenance, salary disputes, FIR & police matters, cheque bounce, RTI, property, online fraud (UPI scams), ragging, or free legal aid.\n\nI answer in **your language + हिंदी + English**. Main general legal information deta hoon, advice nahi — apne case ke liye qualified lawyer se milein.', 'bot');
</script>
</body>
</html>
